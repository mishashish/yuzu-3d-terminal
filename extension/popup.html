<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>$YUZU Crypto Companion</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <span class="dot"></span>
        <b>$YUZU RADAR</b>
      </div>
      <div class="head-right">
        <span class="tag" id="feed-meta">LIVE 24H</span>
        <a class="ext-link" href="https://yuzuha-simulator.vercel.app" target="_blank" rel="noopener">3D APP ↗</a>
      </div>
    </header>

    <!-- Live Mini 3D Yuzu Stage + Speech Bubble -->
    <section class="mini-stage-card">
      <div class="mini-3d-wrap" id="mini-3d-wrap">
        <iframe
          id="yuzu-3d-frame"
          src="https://yuzuha-simulator.vercel.app/?mini=1"
          allow="autoplay"
          loading="eager"
          title="Yuzu 3D Companion"
        ></iframe>
      </div>
      <div class="yuzu-speech" id="yuzu-speech">Fetching live exchange prices...</div>
    </section>

    <section class="highlights">
      <div class="hl up">
        <span class="micro" id="lbl-gainer">TOP GAINER</span>
        <b id="top-gainer">—</b>
      </div>
      <div class="hl down">
        <span class="micro">TOP LOSER</span>
        <b id="top-loser">—</b>
      </div>
    </section>

    <section class="list" id="coin-list"></section>

    <footer class="actions">
      <button class="glass-btn pink" id="btn-speak">VOICE BRIEF</button>
      <button class="glass-btn" id="btn-widget">WIDGET: ON</button>
      <button class="glass-btn" id="btn-alerts">ALERTS: ON</button>
      <button class="glass-btn" id="btn-refresh" title="Refresh live prices">R</button>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
